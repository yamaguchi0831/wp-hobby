<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>モバイルヘッダーメニュー | UIモックアップ</title>
  <link rel="stylesheet" href="../asset/css/tokens.css">
  <style>
    * { box-sizing: border-box; }

    html { background: var(--hb-color-neutral-100); }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--hb-color-text-deep);
      font-family: "Noto Sans JP", sans-serif;
      background: var(--hb-color-surface-soft);
    }

    button,
    a { font: inherit; }

    button { cursor: pointer; }

    a { color: inherit; }

    .hb-header-mock {
      position: relative;
      width: min(100%, 430px);
      min-height: 100svh;
      margin-inline: auto;
      overflow: clip;
      background: var(--hb-color-surface-soft);
      box-shadow: var(--hb-shadow-lg);
    }

    .hb-header-mock__header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: var(--hb-space-xs);
      align-items: center;
      min-height: 72px;
      padding: var(--hb-space-sm) var(--hb-space-md);
      border-bottom: 1px solid var(--hb-color-border-muted);
      background: var(--hb-color-white-alpha-94);
      backdrop-filter: saturate(160%) blur(10px);
    }

    .hb-header-mock__brand {
      display: inline-grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: var(--hb-space-xs);
      align-items: center;
      min-width: 0;
      text-decoration: none;
    }

    .hb-header-mock__brand-mark {
      display: block;
      width: 32px;
      height: 32px;
      border-radius: var(--hb-radius-sm);
      object-fit: cover;
    }

    .hb-header-mock__brand-name,
    .hb-header-mock__brand-sub {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hb-header-mock__brand-name {
      color: var(--hb-color-text-deep);
      font-size: var(--hb-font-size-h4);
      font-weight: 900;
      line-height: 1.1;
    }

    .hb-header-mock__brand-sub {
      color: var(--hb-color-primary-600);
      font-size: var(--hb-font-size-caption);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.08em;
    }

    .hb-header-mock__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: var(--hb-space-xs) var(--hb-space-sm);
      border-radius: var(--hb-radius-full);
      background: var(--hb-gradient-primary);
      color: var(--hb-color-white);
      font-size: var(--hb-font-size-caption);
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--hb-shadow-sm);
    }

    .hb-header-mock__menu-button {
      display: inline-grid;
      width: 44px;
      min-width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--hb-color-border-strong);
      border-radius: var(--hb-radius-sm);
      place-items: center;
      background: var(--hb-color-white);
      color: var(--hb-color-primary-700);
    }

    .hb-header-mock__menu-icon,
    .hb-header-mock__menu-icon::before,
    .hb-header-mock__menu-icon::after {
      display: block;
      width: var(--hb-space-lg);
      height: 2px;
      border-radius: var(--hb-radius-full);
      background: currentcolor;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .hb-header-mock__menu-icon { position: relative; }

    .hb-header-mock__menu-icon::before,
    .hb-header-mock__menu-icon::after {
      position: absolute;
      content: "";
      left: 0;
    }

    .hb-header-mock__menu-icon::before { transform: translateY(-8px); }
    .hb-header-mock__menu-icon::after { transform: translateY(8px); }

    .hb-header-mock__menu-button[aria-expanded="true"] .hb-header-mock__menu-icon {
      background: transparent;
    }

    .hb-header-mock__menu-button[aria-expanded="true"] .hb-header-mock__menu-icon::before {
      transform: rotate(45deg);
    }

    .hb-header-mock__menu-button[aria-expanded="true"] .hb-header-mock__menu-icon::after {
      transform: rotate(-45deg);
    }

    .hb-header-mock__menu-button:focus-visible,
    .hb-header-mock__drawer a:focus-visible {
      outline: 3px solid var(--hb-color-primary-300);
      outline-offset: 3px;
    }

    .hb-header-mock__content {
      display: grid;
      gap: var(--hb-space-xl);
      padding: var(--hb-space-2xl) var(--hb-space-md);
    }

    .hb-header-mock__eyebrow {
      margin: 0;
      color: var(--hb-color-primary-600);
      font-size: var(--hb-font-size-caption);
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .hb-header-mock__title {
      margin: 0;
      font-size: var(--hb-font-size-h1);
      line-height: 1.45;
    }

    .hb-header-mock__card {
      display: grid;
      gap: var(--hb-space-sm);
      padding: var(--hb-space-lg);
      border: 1px solid var(--hb-color-border-muted);
      border-radius: var(--hb-radius-md);
      background: var(--hb-color-white);
      box-shadow: var(--hb-shadow-sm);
    }

    .hb-header-mock__overlay {
      position: fixed;
      z-index: 30;
      inset: 0;
      visibility: hidden;
      background: var(--hb-color-primary-alpha-24);
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .hb-header-mock__drawer {
      position: fixed;
      z-index: 31;
      top: 0;
      right: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(88vw, 360px);
      height: 100svh;
      padding: var(--hb-space-lg) var(--hb-space-md) var(--hb-space-xl);
      background: var(--hb-color-white);
      box-shadow: var(--hb-shadow-lg);
      transform: translateX(100%);
      transition: transform 0.24s ease;
    }

    .hb-header-mock__drawer[aria-hidden="false"] { transform: translateX(0); }

    .hb-header-mock__overlay[aria-hidden="false"] {
      visibility: visible;
      opacity: 1;
    }

    .hb-header-mock__drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--hb-space-sm);
      padding-bottom: var(--hb-space-md);
      border-bottom: 1px solid var(--hb-color-border-muted);
    }

    .hb-header-mock__drawer-title {
      margin: 0;
      color: var(--hb-color-text-deep);
      font-size: var(--hb-font-size-h4);
      font-weight: 900;
    }

    .hb-header-mock__close {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--hb-color-border-strong);
      border-radius: var(--hb-radius-sm);
      background: var(--hb-color-white);
      color: var(--hb-color-primary-700);
      font-size: var(--hb-font-size-h3);
    }

    .hb-header-mock__nav {
      padding-top: var(--hb-space-md);
    }

    .hb-header-mock__nav-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .hb-header-mock__nav-list li + li {
      border-top: 1px solid var(--hb-color-border-muted);
    }

    .hb-header-mock__nav-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      padding: var(--hb-space-sm) var(--hb-space-xs);
      color: var(--hb-color-text-deep);
      font-size: var(--hb-font-size-h4);
      font-weight: 700;
      text-decoration: none;
    }

    .hb-header-mock__nav-list a::after {
      color: var(--hb-color-primary-600);
      content: "›";
      font-size: var(--hb-font-size-h2);
      font-weight: 500;
    }

    .hb-header-mock__drawer-cta {
      display: grid;
      gap: var(--hb-space-xs);
      padding-top: var(--hb-space-md);
      border-top: 1px solid var(--hb-color-border-muted);
      color: var(--hb-color-text-muted);
      font-size: var(--hb-font-size-caption);
      text-align: center;
    }

    .hb-header-mock__drawer-cta a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: var(--hb-space-sm) var(--hb-space-md);
      border-radius: var(--hb-radius-full);
      background: var(--hb-gradient-primary);
      color: var(--hb-color-white);
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--hb-shadow-sm);
    }

    .hb-header-mock__status {
      min-height: 1.5em;
      margin: 0;
      color: var(--hb-color-primary-700);
      font-size: var(--hb-font-size-body--sm);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="hb-header-mock">
    <header class="hb-header-mock__header">
      <a class="hb-header-mock__brand" href="#top" aria-label="売買コムズ Hobbyベース トップ">
        <img class="hb-header-mock__brand-mark" src="../images/logomark.png" alt="">
        <span>
          <span class="hb-header-mock__brand-name">売買コムズ</span>
          <span class="hb-header-mock__brand-sub">Hobbyベース</span>
        </span>
      </a>
      <a class="hb-header-mock__cta" href="#contact">無料査定を申し込む</a>
      <button class="hb-header-mock__menu-button" type="button" aria-controls="mobile-menu" aria-expanded="false" aria-label="メニューを開く">
        <span class="hb-header-mock__menu-icon" aria-hidden="true"></span>
      </button>
    </header>

    <main id="top" class="hb-header-mock__content">
      <p class="hb-header-mock__eyebrow">MOBILE HEADER MOCKUP</p>
      <h1 class="hb-header-mock__title">メニューの見た目と操作を確認</h1>
      <section class="hb-header-mock__card" aria-labelledby="mock-point-title">
        <h2 id="mock-point-title">確認ポイント</h2>
        <p>右上のメニューをタップすると、右側からナビゲーションが開きます。背景タップ、閉じるボタン、Escキー、メニュー選択で閉じます。</p>
        <p class="hb-header-mock__status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <div class="hb-header-mock__overlay" data-menu-close aria-hidden="true"></div>
  <aside id="mobile-menu" class="hb-header-mock__drawer" aria-label="モバイルメニュー" aria-hidden="true">
    <div class="hb-header-mock__drawer-header">
      <p class="hb-header-mock__drawer-title">メニュー</p>
      <button class="hb-header-mock__close" type="button" data-menu-close aria-label="メニューを閉じる">×</button>
    </div>
    <nav class="hb-header-mock__nav" aria-label="モバイル用グローバルナビ">
      <ul class="hb-header-mock__nav-list">
        <li><a href="#flow">買取方法</a></li>
        <li><a href="#genre-list">買取品目一覧</a></li>
        <li><a href="#column">コラム</a></li>
        <li><a href="#faq">よくある質問</a></li>
        <li><a href="#company">会社概要</a></li>
      </ul>
    </nav>
    <div class="hb-header-mock__drawer-cta">
      <span>24時間受付中・査定料無料</span>
      <a href="#contact">無料査定を申し込む</a>
    </div>
  </aside>

  <script>
    const menuButton = document.querySelector('.hb-header-mock__menu-button');
    const drawer = document.querySelector('.hb-header-mock__drawer');
    const overlay = document.querySelector('.hb-header-mock__overlay');
    const status = document.querySelector('.hb-header-mock__status');
    let lastFocusedElement;

    const setMenuState = (isOpen) => {
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
      drawer.setAttribute('aria-hidden', String(!isOpen));
      overlay.setAttribute('aria-hidden', String(!isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';

      if (isOpen) {
        lastFocusedElement = document.activeElement;
        drawer.querySelector('a').focus();
      } else if (lastFocusedElement) {
        lastFocusedElement.focus();
      }
    };

    menuButton.addEventListener('click', () => {
      setMenuState(menuButton.getAttribute('aria-expanded') !== 'true');
    });

    document.querySelectorAll('[data-menu-close]').forEach((element) => {
      element.addEventListener('click', () => setMenuState(false));
    });

    drawer.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        status.textContent = `「${link.textContent}」を選択しました。`;
        setMenuState(false);
      });
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') {
        setMenuState(false);
      }
    });
  </script>
</body>
</html>
